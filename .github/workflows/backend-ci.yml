name: Backend CI

on:
  push:
    branches: [ main, develop, "002-feature-title-genvqa-v2" ]
    paths:
      - '**.py'
      - 'requirements_api.txt'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**.py'
      - 'requirements_api.txt'

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r requirements_api.txt

      - name: Lint with flake8
        run: |
          # Stop build on syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=__pycache__,experiments,dataset,scores,exp_results
          # Warn on style issues (don't fail)
          flake8 . --count --exit-zero --max-complexity=12 --max-line-length=100 \
            --statistics --exclude=__pycache__,experiments,dataset,scores,exp_results

      - name: Run VQA enhancement tests (no GPU, mock mode)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CI: "true"
        run: |
          python -m pytest test_vqa_enhancements.py -v --tb=short || true
